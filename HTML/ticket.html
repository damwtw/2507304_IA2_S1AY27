
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf 2026 | Your Ticket</title>
    <link rel="icon" href="../assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/ticket.js" defer></script>
</head>
<body>
    <header class="site-header">
        <img src="../assets/images/logo-full.svg"
             alt="Coding Conf" class="logo">
    </header>

    <main class="ticket-page" id="ticketPage" hidden>
        <h1>
            Congrats, <span class="highlight" id="attendeeName"></span>!
            Your ticket is ready.
        </h1>

        <p class="subtitle">
            Your ticket has been generated for
            <span class="highlight" id="attendeeEmail"></span>.
            Keep this page for your event details.
        </p>

        <section class="ticket-card" aria-label="Conference ticket">
            <div class="ticket-main">
                <div class="ticket-header">
                    <img src="../assets/images/logo-full.svg"
                         alt="Coding Conf" class="ticket-logo">

                    <p class="ticket-date">
                        Oct 26, 2026 / Kingston, Jamaica
                    </p>
                </div>

                <div class="ticket-user">
                    <img id="ticketAvatar"
                         class="ticket-avatar"
                         alt="Attendee avatar">

                    <div class="ticket-user-info">
                        <h2 id="ticketName"></h2>

                        <p class="ticket-github">
                            <img src="../assets/images/icon-github.svg"
                                 alt="">
                            <a id="ticketGithub" target="_blank" rel="noopener noreferrer"></a>
                        </p>
                    </div>
                </div>
            </div>

            <div class="ticket-stub">
                <span id="ticketNumber" class="ticket-number"></span>
            </div>
        </section>
    </main>

    <main class="ticket-page" id="missingTicket" hidden>
        <h1>No ticket found</h1>
        <p class="subtitle">
            Complete the registration form to generate your ticket.
        </p>
        <a href="login.html" class="register-btn">
            Register Now
        </a>
    </main>
</body>
</html>
